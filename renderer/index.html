<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文件压缩器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>文件压缩器</h1>
      <span class="subtitle">图片批量压缩 / 格式转换 / 体积优化</span>
    </header>

    <!-- 设置 -->
    <div class="settings">
      <div class="setting-row">
        <label>压缩质量</label>
        <input type="range" id="quality" min="10" max="100" value="80">
        <span id="quality-val">80</span>
      </div>
      <div class="setting-row">
        <label>最大宽度（可选）</label>
        <input type="number" id="maxWidth" placeholder="不限制">
        <label>最大高度（可选）</label>
        <input type="number" id="maxHeight" placeholder="不限制">
      </div>
    </div>

    <!-- 拖拽区 -->
    <div class="drop-zone" id="dropZone">
      拖拽图片文件到此处（支持 JPG / PNG / WebP）<br>
      或点击选择文件
    </div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList"></div>

    <!-- 操作按钮 -->
    <div class="actions" id="actions" style="display:none">
      <button class="btn-primary" id="btnCompress">压缩全部</button>
      <button class="btn-ghost" id="btnClear">清空</button>
    </div>

    <!-- 结果 -->
    <div class="results" id="results" style="display:none">
      <h3>压缩结果</h3>
      <div id="resultList"></div>
      <div class="result-summary" id="resultSummary"></div>
      <button class="btn-primary" id="btnSave">全部保存</button>
    </div>

    <!-- 状态 -->
    <div class="status" id="status" style="display:none">
      <div class="spinner"></div>
      <span id="status-text">压缩中...</span>
    </div>
  </div>

  <footer class="app-footer">
    技术交流＋matlabpython888 &nbsp;|&nbsp; GitHub: <a href="https://github.com/zhexatu-bot" target="_blank">zhexatu-bot</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
